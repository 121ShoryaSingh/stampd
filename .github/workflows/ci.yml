name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # prisma.config.ts reads .env.local (Prisma generate runs on install).
      - run: cp .env.example .env.local
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Testcontainers starts Postgres, RustFS and Mailpit on the runner's Docker.
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env.local
      - run: npm ci
      - run: docker compose -f compose.dev.yml up -d
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            docker compose -f compose.dev.yml exec -T postgres pg_isready -U postgres && exit 0
            sleep 1
          done
          exit 1
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      # Starts `next dev` and the worker itself; mail goes to Mailpit from compose.dev.yml.
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target runtime -t stampd:ci .
      - run: docker build --target migrate -t stampd-migrate:ci .
      - run: docker build --target backup -t stampd-backup:ci .
